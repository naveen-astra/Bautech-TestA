# The three controls the guide itself flags as carrying the risk. Worth calling
# out in diagnosis: a permission failure here is a security finding, not a bug.
high_risk_controls:
  - module: tasks_emb
    action: approve_emb_internal
    why: A measurement must be approved before a payment against it counts.
  - module: money
    action: view_profit_margin
    why: Owner-only. Everyone else sees costs and payments, never margin.
  - module: money
    action: delete_financial_entry
    why: High-trust. This is where a ledger could be quietly changed.
