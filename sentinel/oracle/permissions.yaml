# Bautech role x action permission matrix.
#
# Source: "Bautech - The Complete Guide" (v4), section 4, "The full detail -
# every action, every role". This is Navicon's own published specification.
#
# WHAT THIS IS FOR
#   An *independent* expectation, separate from the Expected column of the test
#   sheet. It is used to explain and cross-check verdicts, and to pick the
#   control persona for a differential probe (to prove a Site Engineer cannot
#   see a control, we need to know who legitimately can).
#
# WHAT THIS IS NOT
#   It never sets a verdict. A verdict comes from what the device actually did.
#   If this file and the observed behaviour disagree, that disagreement is the
#   finding - it is reported, not resolved by trusting the document.
#
# GRANT VOCABULARY
#   full        create/edit/delete within scope
#   yes         allowed
#   yes_plus    allowed, and additionally sees profit / margin
#   view        read-only
#   site        their assigned site(s) only
#   own         only their own entries
#   own_project their project only (external client)
#   raise       may submit, may not finalise
#   log         ground logging only
#   stock       stock / low-stock only
#   fin         money entries only
#   del         delete permitted, narrower than full
#   if_set      only when named as approver
#   link        via external link only
#   none        not available
#
# Anything other than `none` means the affordance should exist for that role.

roles:
  own: Owner / Super Admin
  adm: Admin
  mgr: Manager
  acc: Accountant
  eng: Site Engineer
  mem: Site Member
  cli: Client (external)
  ext: External Approver (link)

