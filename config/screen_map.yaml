# Screen map - the only place UI knowledge lives.
#
# A compiled TestPlan names logical targets ("stock_level", "add_site_button").
# This file turns those into Maestro selectors. That split is what keeps the
# system general: when Bautech moves a button, this file changes and no Python
# does. It is also what stops the LLM inventing selectors it cannot know.
#
# ---------------------------------------------------------------------------
# STATUS: GROUNDED BUT UNVERIFIED
#
# app-debug.apk arrived on 2026-09-02 and was inspected with
# tools/inspect_apk.py (see config/apk_report.json). That confirmed the package
# id, that the app is Flutter, and - most usefully - it recovered the app's
# entire English localisation table (config/app_labels.json, 6779 strings),
# because a debug build embeds the generated l10n class as source, with the
# English text sitting in doc comments above each getter:
#
#     /// In en, this message translates to:
#     /// **'Add Site'**
#     String get homeScreenAddSiteTitle;
#
# That upgrades most entries below from a screenshot guess to an exact string
# straight out of the build - `source: apk_string`. It does NOT tell us which
# screen shows which string; that a label exists says nothing about where it
# appears. So `verified` still means one thing only: confirmed against a
# running build via `maestro hierarchy`, and every entry below is still
# `verified: false` until that happens. The renderer still refuses to emit a
# flow for an unverified target unless SENTINEL_ALLOW_UNVERIFIED=1.
#
# Sources:
#   apk_string  exact text pulled from this build's localisation table
#   screenshot  read off a real screen capture (drawer, auth, notifications)
#   guide       a module or label named in "Bautech - The Complete Guide"
#   assumed     a plausible guess, unconfirmed by any of the above
# ---------------------------------------------------------------------------

meta:
  app_id: com.naviconinfra.bautech   # confirmed: tools/inspect_apk.py
  platform: android
  ui_toolkit: flutter                # confirmed: libflutter.so + kernel_blob.bin present
  build: app-debug.apk v0.1.2 (code 11), debug/JIT, abis arm64-v8a+armeabi-v7a+x86_64
  firebase_project: navicon-erp       # confirmed: compiled resources
  verified: false

# Flutter exposes text and Semantics identifiers, never widget Keys. Prefer an
# id selector when the app sets Semantics.identifier; fall back to text.
selector_preference: [id, text]

# ---------------------------------------------------------------------------
# Screens. `anchor` is the element that proves we actually arrived - it is the
# reachability rung of the negative-case ladder, so it must be something only
# this screen shows.
# ---------------------------------------------------------------------------
screens:

  login:
    anchor: {text: "Welcome Back"}
    source: apk_string   # key: homeWelcomeBack (also confirms the screenshot)
    verified: false

  otp_entry:
    anchor: {text: "OTP Verification"}
    source: apk_string   # key: authOtpVerificationTitle
    verified: false

  home:
    anchor: {text: "New Site"}
    source: screenshot
    verified: false

  drawer:
    anchor: {text: "Profile Completion"}
    source: screenshot
    verified: false
    opened_by: {id: "hamburger", text: "Menu"}

  sites_list:
    # Was anchored on "Sites" - identical to the nav item that opens it, so it
    # could not tell "the screen opened" from "the nav bar is still on screen".
    # This is the search-bar placeholder, unique to this screen.
    anchor: {text: "Site name, code or address"}
    source: apk_string   # key: sitesHomeSearchHint
    verified: false

  site_home:
    anchor: {text: "Modules"}
    source: guide
    verified: false

  material:
    # Was "Material" - same text as the nav tap. Real screen title instead.
    anchor: {text: "Inventory Management"}
    source: apk_string   # key: inventoryTitle
    verified: false

  machinery:
    anchor: {text: "Machinery Status"}
    source: apk_string   # key: machineryStatusTitle
    verified: false

  labour:
    anchor: {text: "Labour Management"}
    source: apk_string   # key: labourManagementTitle
    verified: false

  tasks:
    anchor: {text: "Tasks Overview"}
    source: apk_string   # key: tasksOverview
    verified: false

  emb:
    anchor: {text: "Pending eMBs"}
    source: apk_string   # key: embPendingTab; eMB lives under Tasks, not its own nav item
    verified: false

  expenses:
    anchor: {text: "Expenses Dashboard"}
    source: apk_string   # key: expensesDashboard
    verified: false

  parties:
    anchor: {text: "Party Management"}
    source: apk_string   # key: partyManagementTitle
    verified: false

  reports:
    # "Reports" alone repeats the l10n key explorerReportsTitle AND the nav
    # label - kept only as a fallback fact, not yet grounded as distinct.
    anchor: {text: "Reports"}
    source: apk_string
    verified: false

  chat:
    anchor: {text: "Chats"}
    source: screenshot
    verified: false

  notifications:
    anchor: {text: "Notifications"}
    source: screenshot
    verified: false

  alerts:
    # DISCREPANCY: the screenshot (photo_2026-08-26_19-55-12.jpg) shows a tab
    # labelled "My Alerts (2)", but that exact string is not in this build's
    # localisation table at all - only "Alerts", "All Alerts", "Total Alerts"
    # etc exist. Likely the screenshot is from an older or newer version than
    # app-debug.apk v0.1.2. Left as the screenshot text for now; confirm the
    # real tab label with `maestro hierarchy` rather than trusting either
    # source blindly.
    anchor: {text: "My Alerts"}
    source: screenshot
    verified: false

  issues:
    # STILL WEAK: issuesScreenTitle is 'Issues', same as the nav tap. The only
    # other issues-prefixed strings are the empty-state ("No Open Issues"),
    # which will not be on screen once test data exists - not a safe anchor
    # either. Needs a real hierarchy dump to find something that is always
    # there (a filter chip, a header row) rather than picking a guess here.
    anchor: {text: "Issues"}
    source: apk_string   # key: issuesScreenTitle - confirmed text, weak anchor
    verified: false

  invite_manage_users:
    # Was "Invite & Manage Users" - same text as the drawer item that opens
    # it. This subtitle only appears once the screen itself has rendered.
    anchor: {text: "A quick summary of your team and sites"}
    source: apk_string   # key: inviteDashboardOverviewSubtitle
    verified: false

  billing:
    anchor: {text: "Manage your plan, seats, and payment method"}
    source: apk_string   # key: explorerGsBillingPaymentSubtitle
    verified: false

  my_licence:
    anchor: {text: "My Licence"}
    source: apk_string   # key: myLicenceTitle (confirms the screenshot)
    verified: false

  settings:
    anchor: {text: "Settings"}
    source: apk_string   # key: settingsTitle
    verified: false

# ---------------------------------------------------------------------------
# Navigation. How to reach a screen from the app home. The renderer emits these
# as a tap sequence; `via_drawer` opens the side menu first.
# ---------------------------------------------------------------------------
navigation:
  drawer_items:      # seen on a real capture of the side menu
    source: screenshot
    items:
      invite_manage_users: "Invite & Manage Users"
      billing: "Billing & Payment"
      company_profile: "Company Profile"
      my_licence: "My Licence"
      settings: "Settings"
      chat: "BauChat preview"
      explorer: "Explorer Home"

  routes:
    sites_list:   {from: home, taps: ["Sites"], source: assumed}
    material:     {from: site_home, taps: ["Material"], source: assumed}
    machinery:    {from: site_home, taps: ["Machinery"], source: assumed}
    labour:       {from: site_home, taps: ["Labour"], source: assumed}
    tasks:        {from: site_home, taps: ["Tasks"], source: assumed}
    expenses:     {from: site_home, taps: ["Expenses"], source: assumed}
    parties:      {from: site_home, taps: ["Parties"], source: assumed}
    reports:      {from: site_home, taps: ["Reports"], source: assumed}
    issues:       {from: site_home, taps: ["Issues"], source: assumed}
    billing:      {from: home, via_drawer: true, taps: ["Billing & Payment"], source: screenshot}
    invite_manage_users:
                  {from: home, via_drawer: true, taps: ["Invite & Manage Users"], source: screenshot}

# ---------------------------------------------------------------------------
# Controls. Named affordances a test may look for or act on. Prohibition
# assertions ("Engineer must not see Add Site") resolve through here, and each
# one records the module/action it corresponds to so the oracle can name the
# control persona for a differential probe.
# ---------------------------------------------------------------------------
controls:

  add_site_button:
    # AMBIGUOUS: three different confirmed strings could be this button, likely
    # at different points of the flow rather than one being simply wrong -
    #   "Add Site"    homeScreenAddSiteTitle (possibly the empty-state CTA)
    #   "New Site"    explorerSitesNewSite / sitesHomeTapNewSite hint text
    #                 ('Tap "+ New Site" to add one.' - suggests a FAB, not this)
    #   "Create Site" siteCreateButton / siteCreateSite (the create-form submit)
    # Guessing which applies to *this* control - the tap on the Sites list that
    # opens the create flow - would defeat the purpose of flagging it. Confirm
    # with `maestro hierarchy` on the Sites screen before trusting this.
    screen: sites_list
    selector: {text: "Add Site"}
    spec: {module: sites, action: create_site}
    source: assumed
    verified: false

  edit_site_button:
    screen: site_home
    selector: {text: "Edit"}
    spec: {module: sites, action: edit_site_details}
    source: assumed
    verified: false

  site_modules_toggle:
    screen: site_home
    selector: {text: "Modules"}
    spec: {module: sites, action: enable_disable_modules}
    source: assumed
    verified: false

  approve_join_request_button:
    screen: invite_manage_users
    selector: {text: "Approve"}
    spec: {module: users, action: approve_reject_join}
    source: assumed
    verified: false

  buy_licence_button:
    screen: billing
    selector: {text: "Buy"}
    spec: {module: users, action: buy_add_remove_licences}
    source: assumed
    verified: false

  remove_owner_button:
    screen: invite_manage_users
    selector: {text: "Remove"}
    spec: {module: users, action: edit_owner_transfer}
    source: assumed
    verified: false

  approve_emb_button:
    screen: emb
    selector: {text: "Approve"}
    spec: {module: tasks_emb, action: approve_emb_internal}
    source: assumed
    verified: false

  end_rental_button:
    screen: machinery
    selector: {text: "End Rental"}
    spec: {module: machinery, action: end_rental_convert_owned}
    source: assumed
    verified: false

  create_global_alert_button:
    screen: alerts
    selector: {text: "Create Alert"}
    spec: {module: alerts, action: set_global_alert_rule}
    source: screenshot
    verified: false

  direct_message_button:
    screen: chat
    selector: {text: "New Message"}
    spec: {module: chat, action: direct_message}
    source: assumed
    verified: false

# ---------------------------------------------------------------------------
# Values. Things a test reads. `kind: numeric` values are parsed into a number
# so the verifier can do arithmetic on them; the parse rule strips currency and
# unit noise ("600 bags", "Rs 1,300").
# ---------------------------------------------------------------------------
values:

  stock_level:
    screen: material
    selector: {id: "stock_value"}
    kind: numeric
    source: assumed
    verified: false

  monthly_bill_total:
    screen: billing
    selector: {text: "Total"}
    kind: numeric
    source: assumed
    verified: false

  licence_tier_name:
    screen: my_licence
    selector: {id: "licence_tier"}
    kind: text
    source: assumed
    verified: false

  emb_approval_status:
    screen: emb
    selector: {id: "approval_status"}
    kind: text
    source: assumed
    verified: false

# ---------------------------------------------------------------------------
# Entities. A create/edit form, described once and reused. This is what stops
# the suite from becoming 85 bespoke scripts.
# ---------------------------------------------------------------------------
entities:

  site:
    screen: sites_list
    open_create: {text: "Add Site"}
    fields:
      name: {selector: {id: "site_name"}, source: assumed}
      address: {selector: {id: "site_address"}, source: assumed}
    submit: {text: "Save"}
    list_item: {text: "${name}"}
    verified: false

  material_purchase:
    screen: material
    open_create: {text: "Add purchase"}
    fields:
      item: {selector: {id: "material_item"}, source: assumed}
      quantity: {selector: {id: "material_qty"}, source: assumed}
      vendor: {selector: {id: "material_vendor"}, source: assumed}
    submit: {text: "Save"}
    verified: false

  task:
    screen: tasks
    open_create: {text: "Add Task"}
    fields:
      name: {selector: {id: "task_name"}, source: assumed}
      quantity: {selector: {id: "task_qty"}, source: assumed}
    submit: {text: "Save"}
    verified: false

  emb_entry:
    screen: emb
    open_create: {text: "Add entry"}
    fields:
      quantity: {selector: {id: "emb_qty"}, source: assumed}
    submit: {text: "Save"}
    verified: false

  party:
    screen: parties
    open_create: {text: "Add"}
    fields:
      name: {selector: {id: "party_name"}, source: assumed}
      type: {selector: {id: "party_type"}, source: assumed}
    submit: {text: "Save"}
    verified: false

# ---------------------------------------------------------------------------
# Text that means "the app refused". Used by the enforcement rung: an attempt
# that lands on one of these is evidence of a deliberate block rather than an
# automation stall.
# ---------------------------------------------------------------------------
# Confirmed against app-debug.apk's localisation table (config/app_labels.json)
# rather than guessed. These are the app's own words for a refusal, found by
# sweeping all 6779 strings for permission/access/restriction language:
#
#   errAuthNoPermission              "You don't have permission to perform this action."
#   errDbNoPermissionChange          "You don't have permission to change this. Contact
#                                      your site admin if you think you should."
#   errorPermission                  "Permission denied"
#   errorUnauthorized                "Unauthorized access"
#   machineryVendorsAccessRestricted "Access Restricted: Vendors tab is not accessible
#                                      for site members."
#   reportsMembersNotAllowedAccess   "Members are not allowed access to the report
#                                      module."
#
# The generic guesses below are kept as a fallback for refusal text these six
# do not cover, but the app-sourced strings above are what the enforcement rung
# should actually match on first.
refusal_markers:
  - "you don't have permission"
  - "you do not have permission"
  - "permission denied"
  - "unauthorized access"
  - "unauthorised access"
  - "access restricted"
  - "not allowed access"
  - "not authorised"
  - "not authorized"
  - "access denied"
  - "not allowed"
  - "restricted"
  - "contact your admin"
  - "contact your site admin"
