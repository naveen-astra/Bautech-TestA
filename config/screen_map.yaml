# Screen map - the only place UI knowledge lives.
#
# A compiled TestPlan names logical targets ("stock_level", "add_site_button").
# This file turns those into Maestro selectors. That split is what keeps the
# system general: when Bautech moves a button, this file changes and no Python
# does. It is also what stops the LLM inventing selectors it cannot know.
#
# ---------------------------------------------------------------------------
# STATUS: UNVERIFIED
#
# Every entry below is a hypothesis. Nothing here has been checked against a
# running build, because no Bautech APK was available when this was written.
# The seeded entries come from two sources, both marked per-entry:
#
#   screenshot  - read off a real screen capture (drawer, auth, notifications)
#   guide       - a module or label named in "Bautech - The Complete Guide"
#   assumed     - a plausible guess, unconfirmed
#
# Phase 1 replaces every `source: assumed` with a selector read from
# `maestro hierarchy`, and flips `verified: true`. The renderer refuses to emit
# a flow for an unverified target unless SENTINEL_ALLOW_UNVERIFIED=1, so a run
# cannot quietly depend on a guess.
# ---------------------------------------------------------------------------

meta:
  app_id: null              # Phase 1: adb shell pm list packages | grep -i bau
  platform: android
  ui_toolkit: flutter       # assumed; confirm via `maestro hierarchy` shape
  verified: false

# Flutter exposes text and Semantics identifiers, never widget Keys. Prefer an
# id selector when the app sets Semantics.identifier; fall back to text.
selector_preference: [id, text]

# ---------------------------------------------------------------------------
# Screens. `anchor` is the element that proves we actually arrived - it is the
# reachability rung of the negative-case ladder, so it must be something only
# this screen shows.
# ---------------------------------------------------------------------------
